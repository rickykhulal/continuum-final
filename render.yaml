# Render Blueprint: full Community app plus a persistent Discord gateway worker.
# These are paid starter services: persistent disks and background workers require a paid plan.
# Importing/deploying this blueprint is an operator action; see docs/discord-bot.md.
services:
  - type: web
    name: continuum-final
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev && npm run api:build && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    disk:
      name: community-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATA_BUNDLE_PATH
        value: public/data
      - key: APP_DATA_PATH
        value: /var/data/continuum
      - key: LOG_FORMAT
        value: json
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_REPORT_CHANNEL_ID
        sync: false
      - key: DISCORD_SYNC_SECRET
        sync: false
      # Optional: add FIRMS_MAP_KEY, DISCORD_WEBHOOK_URL or METRICS_TOKEN in the dashboard.
      # Leave PUBLIC_API_BASE_URL unset for same-origin hosting; Render supplies PORT.
  - type: worker
    name: continuum-discord
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm run discord:bot
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_REPORT_CHANNEL_ID
        sync: false
      - key: DISCORD_SYNC_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: COMMUNITY_API_URL
        sync: false
